[project]
name = "yougile-api"
version = "1.4.0"
authors = [
  { name="txello", email="txello7@proton.me" },
]
description = "Yougile API models"
readme = "README.md"
requires-python = ">=3.10"
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]
dependencies = [
  "pydantic",
  "requests",
  "httpx",
]

[project.optional-dependencies]
dev = [
  "pytest>=9",
  "pytest-asyncio>=1.3",
  "pytest-cov>=7.1",
  "pyright>=1.1.408",
  "ruff>=0.15",
  "types-requests>=2.33",
]

[project.urls]
Homepage = "https://github.com/txello/YouGile"
Issues = "https://github.com/txello/YouGile/issues"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "--cov=yougile --cov-report=term-missing"

[tool.coverage.run]
source = ["yougile"]

[tool.coverage.report]
skip_covered = false
show_missing = true
omit = [
  "yougile/models/*",
]

[tool.ruff]
target-version = "py310"
line-length = 88
exclude = [
  ".git",
  ".venv",
  "venv",
  "__pycache__",
]

[tool.ruff.lint]
select = [
  "E",
  "F",
  "I",
  "UP",
]
ignore = [
  "E501",
]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.pyright]
include = ["yougile", "tests"]
exclude = [
  ".venv",
  "venv",
  "__pycache__",
]
pythonVersion = "3.10"
typeCheckingMode = "basic"
reportMissingImports = "none"
reportMissingTypeStubs = "none"
reportMissingModuleSource = "none"
